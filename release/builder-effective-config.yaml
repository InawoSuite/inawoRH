directories:
  output: release
  buildResources: assets
files:
  - filter:
      - build/**/*
      - build/**/*
      - electron-main.js
      - node_modules/**/*
extraMetadata:
  main: build/electron.js
productName: Suite Inawo ERP
win:
  target:
    - nsis
  icon: build/icon.ico
appId: com.inawo.suite
nsis:
  installerIcon: build/icon.ico
  license: LICENSE.txt
  createDesktopShortcut: true
  uninstallerIcon: build/icon.ico
  createStartMenuShortcut: true
  runAfterFinish: true
  oneClick: false
  allowToChangeInstallationDirectory: true
extends: react-cra
electronVersion: 40.0.0
